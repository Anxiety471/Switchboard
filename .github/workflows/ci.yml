name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: switchboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d switchboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/switchboard
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/switchboard_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API and MCP from a clean checkout
        run: |
          set -euo pipefail
          test ! -e packages/shared/dist
          pnpm --filter @switchboard/mcp build
          test -f packages/shared/dist/index.js
          test -f apps/mcp/dist/index.js
          set +e
          timeout 20s node apps/mcp/dist/index.js > /tmp/mcp-start.txt 2>&1
          code=$?
          set -e
          if grep -q ERR_MODULE_NOT_FOUND /tmp/mcp-start.txt; then
            cat /tmp/mcp-start.txt
            exit 1
          fi
          test "$code" -ne 0
          grep -q 'SWITCHBOARD_URL is required' /tmp/mcp-start.txt
          rm -rf packages/shared/dist apps/api/dist apps/mcp/dist
          pnpm --filter @switchboard/api build
          test -f packages/shared/dist/index.js
          test -f apps/api/dist/index.js
          set +e
          timeout 20s env -u DATABASE_URL node apps/api/dist/index.js > /tmp/api-start.txt 2>&1
          code=$?
          set -e
          if grep -q ERR_MODULE_NOT_FOUND /tmp/api-start.txt; then
            cat /tmp/api-start.txt
            exit 1
          fi
          test "$code" -ne 0
          grep -q 'DATABASE_URL is required' /tmp/api-start.txt
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
